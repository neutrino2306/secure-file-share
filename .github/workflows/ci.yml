name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -v

  docker:
    name: Docker build and end-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    env:
      API_KEY: ci-smoke-test-api-key-0123456789
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build -t secure-file-share:ci .

      - name: Start container with a persistent volume
        run: |
          docker volume create sfs-ci-data
          docker run -d --name app -p 8000:8000 \
            -v sfs-ci-data:/data \
            -e SIGNING_SECRET="$(openssl rand -hex 32)" \
            -e API_KEYS="${API_KEY}:ci-user" \
            -e PUBLIC_BASE_URL="http://localhost:8000" \
            secure-file-share:ci

      - name: Smoke test (upload, sign, download, tamper, auth)
        env:
          BASE_URL: http://localhost:8000
          LINK_OUT: /tmp/signed_link.txt
        run: bash scripts/smoke_test.sh

      - name: Signed link still works after a container restart
        run: |
          docker restart app
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -o /dev/null "$(cat /tmp/signed_link.txt)"
          echo "Link survived restart"

      - name: Show container logs
        if: always()
        run: docker logs app || true
